name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev zlib1g-dev

      - name: Build
        run: make

      - name: Regression suite
        run: ./tests/run.sh

      - name: Regression suite (ASan + UBSan)
        run: SV_ASAN=1 ./tests/run.sh
